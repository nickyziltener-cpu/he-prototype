<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Empowerment — Deine Prioritäten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--onboarding-band); position: relative; overflow-x: hidden; }
    body::before { content: ''; position: fixed; top: -40px; right: -60px; width: 260px; height: 260px; background: radial-gradient(circle, var(--rose-300) 0%, transparent 70%); opacity: .18; pointer-events: none; z-index: 0; }
    body::after { content: ''; position: fixed; bottom: -40px; left: -40px; width: 180px; height: 180px; background: radial-gradient(circle, var(--aurora-500) 0%, transparent 70%); opacity: .12; pointer-events: none; z-index: 0; }
    .chip-multi { cursor: pointer; user-select: none; }
    .chip-multi.selected { background: rgba(224,122,150,0.16); border-color: var(--rose-500); color: var(--ink-900); }
    .chip-multi.selected::after { content: ' ✓'; color: var(--rose-500); font-weight: 800; }
    .continue-btn {
      display: block; width: 100%; padding: 15px 24px; background: var(--rose-500); color: #fff;
      border: none; border-radius: 100px; font-family: 'Manrope', sans-serif; font-size: 15px;
      font-weight: 700; cursor: pointer; text-align: center; margin-top: 24px;
      box-shadow: 0 8px 20px -8px rgba(224,122,150,0.50); opacity: 0.4; pointer-events: none;
      transition: opacity 0.2s, box-shadow 0.2s;
    }
    .continue-btn.active { opacity: 1; pointer-events: auto; }
    .max-hint { font-size: 12.5px; color: var(--ink-500); text-align: center; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>

  <div class="progress-bar-container">
    <div class="progress-bar-fill" style="width: 57%;"></div>
  </div>

  <div class="page-wrapper" style="padding-top: 64px;">
    <h1 class="question-title">Was liegt dir gerade am meisten am Herzen?</h1>
    <p class="question-sub">Wähle bis zu 3. PCOS ist bei jeder Person anders — wir zeigen die Evidenz, die deinen Prioritäten am besten entspricht.</p>

    <div class="chips-container" id="chipContainer" style="margin-top: 24px;">
      <button class="chip chip-multi" data-goal="cycle">
        Meinen Zyklus regulieren
        <span class="chip-sub">Regelmäßigere Perioden bekommen, Zyklus besser verstehen</span>
      </button>
      <button class="chip chip-multi" data-goal="skin">
        Haut und Haare in den Griff bekommen
        <span class="chip-sub">Akne, übermäßige Behaarung (Hirsutismus), Haarausdünnung</span>
      </button>
      <button class="chip chip-multi" data-goal="weight">
        Gewicht und Stoffwechselgesundheit
        <span class="chip-sub">Insulinresistenz, Blutzucker, Energiestoffwechsel</span>
      </button>
      <button class="chip chip-multi" data-goal="fertility">
        Fertilität unterstützen
        <span class="chip-sub">Eisprung, Empfängnis, reproduktive Gesundheit</span>
      </button>
      <button class="chip chip-multi" data-goal="energy">
        Energie und Stimmung
        <span class="chip-sub">Erschöpfung, Angst, gedrückte Stimmung, Brain Fog</span>
      </button>
    </div>

    <div class="max-hint" id="maxHint">Wähle bis zu 3, die sich am relevantesten anfühlen</div>

    <button class="continue-btn" id="continueBtn" onclick="continueToNext()">Weiter →</button>

    <a href="q2.html" class="back-link">← Zurück</a>
  </div>

  <script>
    var MAX = 3;
    var selected = [];

    document.querySelectorAll('.chip-multi').forEach(function(chip) {
      chip.addEventListener('click', function() {
        var goal = this.getAttribute('data-goal');
        var idx = selected.indexOf(goal);
        if (idx !== -1) {
          selected.splice(idx, 1);
          this.classList.remove('selected');
        } else {
          if (selected.length >= MAX) {
            document.getElementById('maxHint').textContent = 'Maximal 3 ausgewählt — deselektiere eine, um zu tauschen.';
            document.getElementById('maxHint').style.color = 'var(--rose-500)';
            setTimeout(function() {
              document.getElementById('maxHint').textContent = selected.length + ' von 3 ausgewählt';
              document.getElementById('maxHint').style.color = '';
            }, 2000);
            return;
          }
          selected.push(goal);
          this.classList.add('selected');
        }
        updateUI();
      });
    });

    function updateUI() {
      var btn = document.getElementById('continueBtn');
      var hint = document.getElementById('maxHint');
      if (selected.length === 0) {
        btn.classList.remove('active');
        hint.textContent = 'Wähle bis zu 3, die sich am relevantesten anfühlen';
        hint.style.color = '';
      } else if (selected.length >= MAX) {
        btn.classList.add('active');
        hint.textContent = '3 von 3 ausgewählt';
      } else {
        btn.classList.add('active');
        hint.textContent = selected.length + ' von 3 ausgewählt';
        hint.style.color = '';
      }
    }

    function continueToNext() {
      if (selected.length === 0) return;
      localStorage.setItem('pcos_goals', JSON.stringify(selected));
      localStorage.setItem('pcos_goal', selected[0]);
      window.location.href = 'q4.html';
    }
  </script>

</body>
</html>
