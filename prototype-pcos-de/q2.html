<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Empowerment — Seit wann</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--onboarding-band); position: relative; overflow-x: hidden; }
    body::before { content: ''; position: fixed; top: -40px; right: -60px; width: 260px; height: 260px; background: radial-gradient(circle, var(--rose-300) 0%, transparent 70%); opacity: .18; pointer-events: none; z-index: 0; }
    body::after { content: ''; position: fixed; bottom: -40px; left: -40px; width: 180px; height: 180px; background: radial-gradient(circle, var(--aurora-500) 0%, transparent 70%); opacity: .12; pointer-events: none; z-index: 0; }
  </style>
</head>
<body>

  <div class="progress-bar-container">
    <div class="progress-bar-fill" style="width: 42%;"></div>
  </div>

  <div class="page-wrapper" style="padding-top: 64px;">
    <h1 class="question-title">Wie lange hast du schon diese Symptome?</h1>
    <p class="question-sub">Das hilft uns, das Muster und den Kontext deines PCOS zu verstehen.</p>

    <div class="chips-container" id="chipContainer" style="margin-top: 24px;">
      <button class="chip" data-next="q3.html" data-duration="less-6m">Weniger als 6 Monate</button>
      <button class="chip" data-next="q3.html" data-duration="6m-2y">6 Monate bis 2 Jahre</button>
      <button class="chip" data-next="q3.html" data-duration="more-2y">Mehr als 2 Jahre</button>
      <button class="chip chip-none" data-next="q3.html" data-duration="not-sure">Nicht sicher</button>
    </div>

    <a href="javascript:history.back()" class="back-link">← Zurück</a>
  </div>

  <script>
    document.querySelectorAll('.chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        localStorage.setItem('pcos_duration', this.getAttribute('data-duration'));
        window.location.href = this.getAttribute('data-next');
      });
    });
  </script>

</body>
</html>
