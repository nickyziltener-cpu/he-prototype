<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Empowerment — Diagnosestatus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--onboarding-band); position: relative; overflow-x: hidden; }
    @keyframes rose-bloom { from { opacity: 0; transform: scale(0.88); } to { opacity: 0.22; transform: scale(1); } }
    @keyframes aurora-bloom { from { opacity: 0; transform: scale(0.88); } to { opacity: 0.12; transform: scale(1); } }
    @keyframes write-reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0% 0 0); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    body::before { content: ''; position: fixed; top: -40px; right: -60px; width: 280px; height: 280px; background: radial-gradient(circle, var(--rose-300) 0%, var(--rose-500) 20%, transparent 70%); opacity: 0; pointer-events: none; z-index: 0; animation: rose-bloom 1.2s ease-out 0.2s forwards; }
    body::after { content: ''; position: fixed; left: -40px; top: 30%; width: 200px; height: 200px; background: radial-gradient(circle, var(--aurora-500) 0%, transparent 70%); opacity: 0; pointer-events: none; z-index: 0; animation: aurora-bloom 1.2s ease-out 0.5s forwards; }
    .hl-line { display: block; clip-path: inset(0 100% 0 0); }
    .question-title .hl-line:nth-child(1) { animation: write-reveal 0.5s ease-out 0.3s forwards; }
    .question-title .hl-line:nth-child(2) { animation: write-reveal 0.5s ease-out 0.7s forwards; }
    .chips-container, .back-link, .progress-bar-container { opacity: 0; animation: fade-in 1.0s ease-out 0.9s forwards; }
  </style>
</head>
<body>

  <div class="progress-bar-container">
    <div class="progress-bar-fill" style="width: 14%;"></div>
  </div>

  <div class="page-wrapper" style="padding-top: 64px;">
    <h1 class="question-title">
      <span class="hl-line">Wie ist deine Situation</span>
      <span class="hl-line">mit der Diagnose?</span>
    </h1>

    <div class="chips-container" id="chipContainer" style="margin-top: 24px;">
      <button class="chip" data-next="q2.html" data-diagnosed="yes">
        Ich habe eine bestätigte PCOS-Diagnose
        <span class="chip-sub">Von einer Ärztin oder einem Arzt mit Bluttest oder Ultraschall bestätigt</span>
      </button>
      <button class="chip" data-next="q1a.html" data-diagnosed="suspected">
        Ich vermute, dass ich PCOS haben könnte
        <span class="chip-sub">Symptome passen, aber noch keine formale Diagnose</span>
      </button>
      <button class="chip" data-next="q1a.html" data-diagnosed="exploring">
        Ich bin unsicher — ich habe Symptome und suche Antworten
        <span class="chip-sub">Ich beschreibe, was ich erlebe, damit wir dir helfen können</span>
      </button>
    </div>

    <a href="start.html" class="back-link">← Zurück</a>
  </div>

  <script>
    document.querySelectorAll('.chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        var diagnosed = this.getAttribute('data-diagnosed') || 'exploring';
        localStorage.setItem('pcos_diagnosed', diagnosed);
        if (diagnosed === 'yes') {
          localStorage.removeItem('pcos_priya');
        } else {
          localStorage.setItem('pcos_priya', '1');
        }
        var next = this.getAttribute('data-next');
        if (next) window.location.href = next;
      });
    });
  </script>

</body>
</html>
