<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Empowerment — Behandlungspräferenzen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--onboarding-band); position: relative; overflow-x: hidden; }
    body::before { content: ''; position: fixed; top: -40px; right: -60px; width: 260px; height: 260px; background: radial-gradient(circle, var(--rose-300) 0%, transparent 70%); opacity: .18; pointer-events: none; z-index: 0; }
    body::after { content: ''; position: fixed; bottom: -40px; left: -40px; width: 180px; height: 180px; background: radial-gradient(circle, var(--aurora-500) 0%, transparent 70%); opacity: .12; pointer-events: none; z-index: 0; }

    .multi-chip {
      display: block; width: 100%; padding: 14px 16px;
      border: 1.5px solid rgba(42,31,48,0.14);
      background: rgba(255,255,255,0.60); backdrop-filter: blur(10px);
      border-radius: 8px; font-size: 15px; font-family: 'Manrope', sans-serif;
      color: var(--ink-900); cursor: pointer; text-align: left;
      transition: border-color 0.12s ease, background 0.12s ease;
      margin-bottom: 8px;
    }
    .multi-chip:hover { border-color: var(--rose-500); background: rgba(224,122,150,.06); }
    .multi-chip.selected { background: rgba(224,122,150,.10); border-color: var(--rose-500); }
    .multi-chip.selected::before { content: '✓ '; color: var(--rose-500); font-weight: 700; }
    .chip-sub { display: block; font-size: 12px; color: inherit; opacity: 0.75; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="progress-bar-container">
    <div class="progress-bar-fill" style="width: 71%;"></div>
  </div>

  <div class="page-wrapper" style="padding-top: 64px;">
    <h1 class="question-title">Welche Ansätze kommen für dich in Frage?</h1>
    <p class="question-sub">Wähle alles, was dich interessiert. Du kannst später jederzeit andere Optionen erkunden — wir starten nur mit diesen.</p>

    <div id="prefContainer" style="margin-top: 24px;">
      <button class="multi-chip" data-pref="diet">
        Ernährung &amp; Nutrition
        <span class="chip-sub">Niedrig-GI-Ernährung, entzündungshemmende Lebensmittel, spezifische Ernährungsformen</span>
      </button>
      <button class="multi-chip" data-pref="supplements">
        Nahrungsergänzungsmittel
        <span class="chip-sub">Inositol, Pfefferminztee, NAC, Vitamine und Mineralstoffe</span>
      </button>
      <button class="multi-chip" data-pref="mindbody">
        Geist &amp; Körper
        <span class="chip-sub">Bewegung, Yoga, Stressmanagement, Schlaf, Akupunktur</span>
      </button>
      <button class="multi-chip" data-pref="medical">
        Medizinische Behandlungen
        <span class="chip-sub">Medikamente und klinische Optionen — alle über Gynäkolog:in</span>
      </button>
    </div>

    <button class="next-btn" id="nextBtn" onclick="goNext()">Weiter →</button>
    <p class="micro-copy" style="margin-top: 12px;">Lieber nicht angeben? <a href="redflag.html" style="color: var(--rose-500);">Überspringen →</a></p>
    <a href="q3.html" class="back-link">← Zurück</a>
  </div>

  <script>
    var selected = [];

    document.querySelectorAll('.multi-chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        var pref = this.getAttribute('data-pref');
        this.classList.toggle('selected');
        var idx = selected.indexOf(pref);
        if (idx > -1) { selected.splice(idx, 1); } else { selected.push(pref); }
        document.getElementById('nextBtn').classList.toggle('visible', selected.length > 0);
      });
    });

    function goNext() {
      localStorage.setItem('pcos_treatment_prefs', JSON.stringify(selected));
      window.location.href = 'redflag.html';
    }
  </script>

</body>
</html>
