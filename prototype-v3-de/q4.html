<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Empowerment — Ernährungs-Auslöser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: var(--onboarding-band);
      position: relative;
      overflow-x: hidden;
    }

    @keyframes ember-bloom {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 0.20; transform: scale(1); }
    }

    @keyframes aurora-bloom {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 0.12; transform: scale(1); }
    }

    @keyframes write-reveal {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0% 0 0); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Q3–Q4: ember right-centre, 260px, 20% */
    body::before {
      content: '';
      position: fixed;
      top: 25%;
      right: -40px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, var(--ember-300) 0%, var(--ember-500) 20%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      animation: ember-bloom 1.2s ease-out 0.2s forwards;
    }

    body::after {
      content: '';
      position: fixed;
      left: -40px;
      top: 30%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, var(--aurora-500) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      animation: aurora-bloom 1.2s ease-out 0.5s forwards;
    }

    .hl-line {
      display: block;
      clip-path: inset(0 100% 0 0);
    }

    .question-title .hl-line:nth-child(1) { animation: write-reveal 0.5s ease-out 0.3s forwards; }
    .question-title .hl-line:nth-child(2) { animation: write-reveal 0.5s ease-out 0.7s forwards; }

    .chips-container,
    .micro-copy,
    .question-sub,
    .back-link,
    .progress-bar-container {
      opacity: 0;
      animation: fade-in 1.0s ease-out 0.9s forwards;
    }
  </style>
</head>
<body>

  <div class="progress-bar-container">
    <div class="progress-bar-fill" style="width: 67%;"></div>
  </div>

  <div class="page-wrapper" style="padding-top: 64px;">
    <h1 class="question-title">
      <span class="hl-line">Lösen bestimmte Lebensmittel</span>
      <span class="hl-line">deine Symptome aus oder verschlimmern sie?</span>
    </h1>
    <p class="question-sub">Alle zutreffenden auswählen.</p>

    <div class="chips-container" id="chipContainer" style="margin-top: 4px;">
      <button class="chip" data-exclusive="false">Gluten oder Weizen</button>
      <button class="chip" data-exclusive="false">Milchprodukte</button>
      <button class="chip" data-exclusive="false">Zwiebeln oder Knoblauch</button>
      <button class="chip" data-exclusive="false">Bohnen oder Linsen</button>
      <button class="chip" data-exclusive="false">Scharfes Essen</button>
      <button class="chip" data-exclusive="false">Koffein</button>
      <button class="chip" data-exclusive="false">Alkohol</button>
      <button class="chip chip-none" data-exclusive="true">Ich bin mir nicht sicher, ich habe keine spezifischen Auslöser identifiziert</button>
      <button class="chip chip-none" data-exclusive="true">Keines davon scheint meine Symptome auszulösen</button>
    </div>

    <button class="next-btn" id="nextBtn">Weiter</button>

    <a href="q3.html" class="back-link">← Zurück</a>
  </div>

  <script>lucide.createIcons();</script>
  <script>
    var chips = document.querySelectorAll('.chip');
    var nextBtn = document.getElementById('nextBtn');

    function updateNextBtn() {
      var anySelected = document.querySelector('.chip.selected');
      if (anySelected) {
        nextBtn.classList.add('visible');
      } else {
        nextBtn.classList.remove('visible');
      }
    }

    chips.forEach(function(chip) {
      chip.addEventListener('click', function() {
        var isExclusive = this.getAttribute('data-exclusive') === 'true';

        if (isExclusive) {
          var wasSelected = this.classList.contains('selected');
          chips.forEach(function(c) { c.classList.remove('selected'); });
          if (!wasSelected) { this.classList.add('selected'); }
        } else {
          chips.forEach(function(c) {
            if (c.getAttribute('data-exclusive') === 'true') {
              c.classList.remove('selected');
            }
          });
          this.classList.toggle('selected');
        }

        updateNextBtn();
      });
    });

    nextBtn.addEventListener('click', function() {
      var exclusive = document.querySelector('.chip.selected[data-exclusive="true"]');
      if (exclusive) {
        localStorage.setItem('food_triggers', JSON.stringify([]));
      } else {
        var selected = Array.from(document.querySelectorAll('.chip.selected'))
          .map(function(c) { return c.textContent.trim(); });
        localStorage.setItem('food_triggers', JSON.stringify(selected));
      }
      window.location.href = 'q5.html';
    });
  </script>

</body>
</html>
