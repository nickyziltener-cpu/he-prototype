<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Empowerment — Stress und Symptome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: var(--onboarding-band);
      position: relative;
      overflow-x: hidden;
    }

    @keyframes ember-bloom {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 0.20; transform: scale(1); }
    }

    @keyframes aurora-bloom {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 0.12; transform: scale(1); }
    }

    @keyframes write-reveal {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0% 0 0); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Q3–Q4: ember right-centre, 260px, 20% */
    body::before {
      content: '';
      position: fixed;
      top: 25%;
      right: -40px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, var(--ember-300) 0%, var(--ember-500) 20%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      animation: ember-bloom 1.2s ease-out 0.2s forwards;
    }

    body::after {
      content: '';
      position: fixed;
      left: -40px;
      top: 30%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, var(--aurora-500) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      animation: aurora-bloom 1.2s ease-out 0.5s forwards;
    }

    .hl-line {
      display: block;
      clip-path: inset(0 100% 0 0);
    }

    .question-title .hl-line:nth-child(1) { animation: write-reveal 0.5s ease-out 0.3s forwards; }
    .question-title .hl-line:nth-child(2) { animation: write-reveal 0.5s ease-out 0.7s forwards; }

    .chips-container,
    .micro-copy,
    .back-link,
    .progress-bar-container {
      opacity: 0;
      animation: fade-in 1.0s ease-out 0.9s forwards;
    }
  </style>
</head>
<body>

  <div class="progress-bar-container">
    <div class="progress-bar-fill" style="width: 50%;"></div>
  </div>

  <div class="page-wrapper" style="padding-top: 64px;">
    <h1 class="question-title">
      <span class="hl-line">Beeinflusst Stress</span>
      <span class="hl-line">deine Symptome?</span>
    </h1>

    <div class="chips-container" id="chipContainer" style="margin-top: 24px;">
      <button class="chip" data-next="q4.html" data-stress="significant">Ja, deutlich. Stress ist ein wesentlicher Auslöser.</button>
      <button class="chip" data-next="q4.html" data-stress="moderate">Ja, etwas. Stressige Phasen verschlimmern es.</button>
      <button class="chip" data-next="q4.html" data-stress="occasional">Gelegentlich, aber nicht zuverlässig.</button>
      <button class="chip" data-next="q4.html" data-stress="none">Nein, Stress scheint mich nicht zu beeinflussen.</button>
    </div>

    <p class="micro-copy">Die Darm-Hirn-Verbindung ist einer der wichtigsten Forschungsbereiche beim Reizdarmsyndrom. Wir zeigen dir, was die Evidenz sagt.</p>

    <a href="q2.html" class="back-link">← Zurück</a>
  </div>

  <script>
    var chips = document.querySelectorAll('.chip');
    chips.forEach(function(chip) {
      chip.addEventListener('click', function() {
        localStorage.setItem('stress', this.getAttribute('data-stress'));
        var next = this.getAttribute('data-next');
        if (next) { window.location.href = next; }
      });
    });
  </script>
  <script>lucide.createIcons();</script>

</body>
</html>
