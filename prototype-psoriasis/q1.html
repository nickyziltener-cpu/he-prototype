<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Empowerment — Your Situation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--onboarding-band); position: relative; overflow-x: hidden; }
    @keyframes ember-bloom { from { opacity: 0; transform: scale(0.88); } to { opacity: 0.20; transform: scale(1); } }
    @keyframes aurora-bloom { from { opacity: 0; transform: scale(0.88); } to { opacity: 0.12; transform: scale(1); } }
    @keyframes write-reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0% 0 0); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    body::before {
      content: ''; position: fixed; top: -40px; right: -60px; width: 280px; height: 280px;
      background: radial-gradient(circle, var(--primary-lt) 0%, var(--primary) 20%, transparent 70%);
      opacity: 0; pointer-events: none; z-index: 0;
      animation: ember-bloom 1.2s ease-out 0.2s forwards;
    }
    body::after {
      content: ''; position: fixed; left: -40px; top: 30%; width: 200px; height: 200px;
      background: radial-gradient(circle, var(--accent-lt) 0%, transparent 70%);
      opacity: 0; pointer-events: none; z-index: 0;
      animation: aurora-bloom 1.2s ease-out 0.5s forwards;
    }
    .hl-line { display: block; clip-path: inset(0 100% 0 0); }
    .question-title .hl-line:nth-child(1) { animation: write-reveal 0.5s ease-out 0.3s forwards; }
    .question-title .hl-line:nth-child(2) { animation: write-reveal 0.5s ease-out 0.7s forwards; }
    .chips-container, .question-sub, .back-link, .progress-bar-container {
      opacity: 0; animation: fade-in 1.0s ease-out 0.9s forwards;
    }
  </style>
</head>
<body>

  <div class="progress-bar-container">
    <div class="progress-bar-fill" style="width: 14%;"></div>
  </div>

  <div class="page-wrapper" style="padding-top: 64px; position: relative; z-index: 1;">
    <h1 class="question-title">
      <span class="hl-line">Have you been diagnosed</span>
      <span class="hl-line">with psoriasis?</span>
    </h1>
    <p class="question-sub">A doctor's diagnosis gives us more to work with — but if you're still figuring it out, we can help with that too.</p>

    <div class="chips-container" id="chipContainer" style="margin-top: 24px;">
      <button class="chip" data-next="q1b.html" data-diagnosed="yes">
        Yes, I have a diagnosis
        <span class="chip-sub">Confirmed by a GP or dermatologist</span>
      </button>
      <button class="chip" data-next="q1a.html" data-diagnosed="probably" data-priya="true">
        I think so
        <span class="chip-sub">I have symptoms but no formal diagnosis yet</span>
      </button>
      <button class="chip" data-next="q1a.html" data-diagnosed="unsure" data-priya="true">
        Not sure
        <span class="chip-sub">Something's going on with my skin — I want answers</span>
      </button>
    </div>

    <a href="start.html" class="back-link">← Back</a>
  </div>

  <script>
    document.querySelectorAll('.chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        localStorage.setItem('psoriasis_diagnosed', this.getAttribute('data-diagnosed'));
        if (this.getAttribute('data-priya') === 'true') {
          localStorage.setItem('priya', 'true');
        } else {
          localStorage.removeItem('priya');
        }
        var next = this.getAttribute('data-next');
        if (next) window.location.href = next;
      });
    });
  </script>
</body>
</html>
