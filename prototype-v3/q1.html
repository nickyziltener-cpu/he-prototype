<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Empowerment — Your IBS Type</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: var(--onboarding-band);
      position: relative;
      overflow-x: hidden;
    }

    @keyframes ember-bloom {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 0.22; transform: scale(1); }
    }

    @keyframes aurora-bloom {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 0.12; transform: scale(1); }
    }

    @keyframes write-reveal {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0% 0 0); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Q1–Q2: ember top-right, 280px, 22% */
    body::before {
      content: '';
      position: fixed;
      top: -40px;
      right: -60px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, var(--ember-300) 0%, var(--ember-500) 20%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      animation: ember-bloom 1.2s ease-out 0.2s forwards;
    }

    body::after {
      content: '';
      position: fixed;
      left: -40px;
      top: 30%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, var(--aurora-500) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      animation: aurora-bloom 1.2s ease-out 0.5s forwards;
    }

    .hl-line {
      display: block;
      clip-path: inset(0 100% 0 0);
    }

    .question-title .hl-line:nth-child(1) { animation: write-reveal 0.5s ease-out 0.3s forwards; }
    .question-title .hl-line:nth-child(2) { animation: write-reveal 0.5s ease-out 0.7s forwards; }

    .chips-container,
    .micro-copy,
    .back-link,
    .progress-bar-container {
      opacity: 0;
      animation: fade-in 1.0s ease-out 0.9s forwards;
    }
  </style>
</head>
<body>

  <div class="progress-bar-container">
    <div class="progress-bar-fill" style="width: 17%;"></div>
  </div>

  <div class="page-wrapper" style="padding-top: 64px;">
    <h1 class="question-title">
      <span class="hl-line">What type of IBS</span>
      <span class="hl-line">do you have?</span>
    </h1>

    <div class="chips-container" id="chipContainer" style="margin-top: 24px;">
      <button class="chip" data-next="q2.html" data-subtype="IBS-D">
        IBS-D (diarrhoea-predominant)
        <span class="chip-sub">Loose stools, urgency, frequency</span>
      </button>
      <button class="chip" data-next="q2.html" data-subtype="IBS-C">
        IBS-C (constipation-predominant)
        <span class="chip-sub">Hard stools, infrequent movements, bloating</span>
      </button>
      <button class="chip" data-next="q2.html" data-subtype="IBS-M">
        IBS-M (mixed)
        <span class="chip-sub">Alternating between both patterns</span>
      </button>
      <button class="chip" data-next="q1a.html" data-subtype="unknown">
        I haven't been diagnosed yet
        <span class="chip-sub">I'll answer a few questions to describe my symptoms</span>
      </button>
    </div>

    <a href="index.html" class="back-link">← Back</a>
  </div>

  <script>
    var chips = document.querySelectorAll('.chip');
    chips.forEach(function(chip) {
      chip.addEventListener('click', function() {
        var isUndiagnosed = this.getAttribute('data-next') === 'q1a.html';
        sessionStorage.setItem('flow', isUndiagnosed ? 'priya' : 'main');
        localStorage.setItem('ibs_subtype', this.getAttribute('data-subtype') || 'unknown');
        if (!isUndiagnosed) {
          localStorage.removeItem('priya');
        }
        var next = this.getAttribute('data-next');
        if (next) {
          window.location.href = next;
        }
      });
    });
  </script>
  <script>lucide.createIcons();</script>

</body>
</html>
