<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Empowerment — Prior Attempts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="progress-bar-container">
    <div class="progress-bar-fill" style="width: 56%;"></div>
  </div>

  <div class="page-wrapper" style="padding-top: 64px;">
    <div style="margin-bottom: 4px;">
      <span class="section-label">Question 5 of 9</span>
    </div>

    <h1 class="question-title">Which of these have you tried for your IBS?</h1>
    <p class="question-sub">Select everything you've tried, even if briefly. We'll use this to show you what you haven't explored yet.</p>

    <div class="chips-container" id="chipContainer">
      <button class="chip" data-type="regular">Low-FODMAP diet</button>
      <button class="chip" data-type="regular">Probiotics</button>
      <button class="chip" data-type="regular">Peppermint oil</button>
      <button class="chip" data-type="regular">
        Antispasmodics
        <span class="chip-sub">(like Buscopan)</span>
      </button>
      <button class="chip" data-type="regular">Gut-directed hypnotherapy (GDH)</button>
      <button class="chip" data-type="regular">Cognitive Behavioural Therapy (CBT)</button>
      <button class="chip" data-type="regular">
        Dietary restriction
        <span class="chip-sub">(e.g. cutting out specific foods)</span>
      </button>
      <button class="chip" data-type="regular">Exercise changes</button>
      <button class="chip" data-type="regular">Prescription medication</button>
      <button class="chip" data-type="regular">Other</button>
      <button class="chip" data-type="exclusive">I haven't tried anything specifically</button>
    </div>

    <button class="next-btn" id="nextBtn" onclick="window.location.href='q6.html'">Next →</button>

    <a href="q4.html" class="back-link">← Back</a>
  </div>

  <script>
    var chips = document.querySelectorAll('.chip');
    var nextBtn = document.getElementById('nextBtn');

    function updateNextBtn() {
      var anySelected = document.querySelector('.chip.selected');
      if (anySelected) {
        nextBtn.classList.add('visible');
      } else {
        nextBtn.classList.remove('visible');
      }
    }

    chips.forEach(function(chip) {
      chip.addEventListener('click', function() {
        var type = this.getAttribute('data-type');

        if (type === 'exclusive') {
          var wasSelected = this.classList.contains('selected');
          chips.forEach(function(c) {
            c.classList.remove('selected');
          });
          if (!wasSelected) {
            this.classList.add('selected');
          }
        } else {
          chips.forEach(function(c) {
            if (c.getAttribute('data-type') === 'exclusive') {
              c.classList.remove('selected');
            }
          });
          this.classList.toggle('selected');
        }

        updateNextBtn();
      });
    });
  </script>
</body>
</html>
